[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegisagent"
version = "0.1.0"
description = "Security-first autonomous agent platform with governed TUI and web control surfaces."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "AegisAgent" }]
dependencies = []

[project.optional-dependencies]
gateway = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
tui = ["textual>=1.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.32"]
dev = ["pytest>=8.0", "httpx>=0.28"]

[project.scripts]
aegisagent = "aegisagent.cli:main"
aegis = "aegisagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
